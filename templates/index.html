<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Интересный маршрут между A и B</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; font-family: Arial, sans-serif; display: flex; height: 100vh; }
    #panel { width: 350px; padding: 14px; background: #f5f6f8; border-right: 1px solid #ddd; overflow-y: auto; }
    #map { flex: 1; }
    button {
      width: 100%; padding: 9px; margin-top: 8px;
      background: #2563eb; color: #fff; border: none;
      border-radius: 5px; cursor: pointer; font-size: 14px;
    }
    button:hover { background: #1d4ed8; }
    button.route-btn { background: #059669; }
    button.route-btn:hover { background: #047857; }
    .box {
      background: #fff; padding: 10px; margin-top: 10px;
      border-radius: 6px; border: 1px solid #e2e8f0; font-size: 13px;
    }
    .box-header { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
    .mini-btns { display: flex; gap: 6px; }
    .mini-btn {
      width: auto; margin-top: 0; padding: 3px 8px;
      font-size: 11px; background: #e2e8f0; color: #1e293b; border-radius: 4px;
    }
    .mini-btn:hover { background: #cbd5e1; }
    .slider-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    input[type="range"] { width: 100%; cursor: pointer; }
    .cat-list { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
    .cat-item { display: flex; align-items: center; gap: 7px; cursor: pointer; }
    .info { font-size: 13px; color: #334155; margin-top: 8px; }
    .stop-item {
      background: #ecfdf5; padding: 7px 9px; margin-top: 6px;
      border-radius: 5px; border: 1px solid #a7f3d0; font-size: 13px;
    }
  </style>
</head>
<body>
  <div id="panel">
    <h3 style="margin-top: 0;">Маршрут через достопримечательности</h3>
    <p style="font-size: 13px; color: #475569; margin: 0 0 8px;">
      1. Кликни по карте — <b>Точка A</b>.<br>
      2. Кликни ещё раз — <b>Точка B</b>.<br>
      3. Выбери категории, BBox и лимит лишнего пути («крюка»).
    </p>

    <div class="box">
      <div class="box-header">
        <b>Категории:</b>
        <div class="mini-btns">
          <button type="button" class="mini-btn" onclick="setAllCategories(true)">Все</button>
          <button type="button" class="mini-btn" onclick="setAllCategories(false)">Сброс</button>
        </div>
      </div>
      <div class="cat-list">
        <label class="cat-item"><input type="checkbox" class="cat-cb" value="tourism_view" checked /> Достопримечательности и виды</label>
        <label class="cat-item"><input type="checkbox" class="cat-cb" value="art" checked /> Искусство и галереи</label>
        <label class="cat-item"><input type="checkbox" class="cat-cb" value="culture" checked /> Музеи и культура</label>
        <label class="cat-item"><input type="checkbox" class="cat-cb" value="historic" checked /> История и памятники</label>
        <label class="cat-item"><input type="checkbox" class="cat-cb" value="nature" checked /> Парки и природа</label>
        <label class="cat-item"><input type="checkbox" class="cat-cb" value="urban" checked /> Город и архитектура</label>
        <label class="cat-item"><input type="checkbox" class="cat-cb" value="worship" checked /> Храмы и культовые места</label>
      </div>
    </div>

    <div class="box">
      <div class="slider-row">
        <label for="padSlider"><b>Отступ BBox:</b></label>
        <span id="padValue">0.020</span>
      </div>
      <input
        id="padSlider"
        type="range"
        min="0.001"
        max="0.050"
        step="0.001"
        value="0.020"
        oninput="onPadChange()"
      />

      <div class="slider-row" style="margin-top: 10px;">
        <label for="detourSlider"><b>Макс. «крюк» (км):</b></label>
        <span id="detourValue">1.5</span>
      </div>
      <input
        id="detourSlider"
        type="range"
        min="0.2"
        max="5.0"
        step="0.1"
        value="1.5"
        oninput="document.getElementById('detourValue').innerText = parseFloat(this.value).toFixed(1)"
      />

      <div class="slider-row" style="margin-top: 10px;">
        <label for="stopsSlider"><b>Макс. остановок:</b></label>
        <span id="stopsValue">3</span>
      </div>
      <input
        id="stopsSlider"
        type="range"
        min="1"
        max="100"
        step="1"
        value="3"
        oninput="document.getElementById('stopsValue').innerText = this.value"
      />
    </div>

    <button onclick="searchInBbox()">1. Найти места в прямоугольнике</button>
    <button class="route-btn" onclick="buildInterestingRoute()">2. Построить маршрут через места</button>

    <div id="status" class="info"></div>
    <div id="route-summary" class="info"></div>
    <div id="stops-list"></div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map("map").setView([51.533562, 46.034266], 13);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap"
    }).addTo(map);

    function invertMapColors(enabled = true) {
      const tilePane = map.getPane("tilePane");
      if (tilePane) {
        tilePane.style.filter = enabled ? "invert(100%) hue-rotate(180deg)" : "none";
      }
    }
    invertMapColors(true);

    let currentPointA = null;
    let currentPointB = null;
    let hasSearchedPlaces = false;
    let markerA = null;
    let markerB = null;
    let rectLayer = null;
    let placeMarkers = [];
    let stopMarkers = [];
    let routeLine = null;

    function getSelectedCategories() {
      return Array.from(document.querySelectorAll(".cat-cb:checked")).map(cb => cb.value);
    }

    function onCategoriesChanged() {
      if (currentPointA && currentPointB && hasSearchedPlaces) {
        searchInBbox(false);
      }
    }

    function setAllCategories(checked) {
      document.querySelectorAll(".cat-cb").forEach(cb => {
        cb.checked = checked;
      });
      onCategoriesChanged();
    }

    document.querySelectorAll(".cat-cb").forEach(cb => {
      cb.addEventListener("change", onCategoriesChanged);
    });

    function getPad() {
      return parseFloat(document.getElementById("padSlider").value);
    }

    function computePreviewBbox(ptA, ptB, pad) {
      return {
        south: Math.min(ptA.lat, ptB.lat) - pad,
        west: Math.min(ptA.lon, ptB.lon) - pad,
        north: Math.max(ptA.lat, ptB.lat) + pad,
        east: Math.max(ptA.lon, ptB.lon) + pad
      };
    }

    function drawRectangle(bbox, fitMap = false) {
      if (rectLayer) {
        map.removeLayer(rectLayer);
        rectLayer = null;
      }
      if (!bbox) return;

      const bounds = [
        [bbox.south, bbox.west],
        [bbox.north, bbox.east]
      ];
      rectLayer = L.rectangle(bounds, {
        color: "#2563eb",
        weight: 2,
        fillOpacity: 0.06
      }).addTo(map);

      if (fitMap) {
        map.fitBounds(bounds, { padding: [25, 25] });
      }
    }

    function clearRouteLayers() {
      if (routeLine) {
        map.removeLayer(routeLine);
        routeLine = null;
      }
      stopMarkers.forEach(m => map.removeLayer(m));
      stopMarkers = [];
      document.getElementById("route-summary").innerText = "";
      document.getElementById("stops-list").innerHTML = "";
    }

    function clearPlaceMarkers() {
      placeMarkers.forEach(m => map.removeLayer(m));
      placeMarkers = [];
    }

    function renderPoints(data) {
      currentPointA = data.point_a || null;
      currentPointB = data.point_b || null;

      if (markerA) { map.removeLayer(markerA); markerA = null; }
      if (markerB) { map.removeLayer(markerB); markerB = null; }

      if (currentPointA) {
        markerA = L.marker([currentPointA.lat, currentPointA.lon])
          .addTo(map).bindPopup("Точка A").openPopup();
      }
      if (currentPointB) {
        markerB = L.marker([currentPointB.lat, currentPointB.lon])
          .addTo(map).bindPopup("Точка B").openPopup();
      }

      if (currentPointA && currentPointB) {
        drawRectangle(computePreviewBbox(currentPointA, currentPointB, getPad()), false);
      } else if (rectLayer) {
        map.removeLayer(rectLayer);
        rectLayer = null;
      }
    }

    function onPadChange() {
      const pad = getPad();
      document.getElementById("padValue").innerText = pad.toFixed(3);
      if (currentPointA && currentPointB) {
        drawRectangle(computePreviewBbox(currentPointA, currentPointB, pad), false);
      }
    }

    function renderPlaces(places) {
      clearPlaceMarkers();
      (places || []).forEach((p) => {
        const catText = p.category_label ? ` (${p.category_label})` : "";
        const dot = L.circleMarker([p.lat, p.lon], {
          radius: 5,
          color: "#dc2626",
          fillColor: "#f87171",
          fillOpacity: 0.8
        }).addTo(map).bindPopup(`Место: ${p.name}${catText}`);
        placeMarkers.push(dot);
      });
    }

    function renderRoute(routeData) {
      clearRouteLayers();
      if (!routeData || !routeData.route) return;

      routeLine = L.polyline(routeData.route.geometry, {
        color: "#059669",
        weight: 5
      }).addTo(map);
      map.fitBounds(routeLine.getBounds(), { padding: [30, 30] });

      document.getElementById("route-summary").innerHTML =
        `<b>Маршрут:</b> ~${routeData.route.distance_km} км · ~${routeData.route.duration_min} мин` +
        (routeData.route.fallback ? " (запасная линия)" : "");

      const stops = routeData.stops || [];
      document.getElementById("stops-list").innerHTML = stops.map((s, idx) => {
        const catText = s.category_label ? ` · ${s.category_label}` : "";
        const m = L.circleMarker([s.lat, s.lon], {
          radius: 8,
          color: "#047857",
          fillColor: "#34d399",
          fillOpacity: 0.95
        }).addTo(map).bindPopup(`<b>Остановка ${idx + 1}: ${s.name}</b>${catText}`);
        stopMarkers.push(m);

        return `
          <div class="stop-item">
            <b>${idx + 1}. ${s.name}</b><br>
            <span style="color:#065f46;font-size:11px;">${s.category_label || s.category || ""} · ${s.lat.toFixed(4)}, ${s.lon.toFixed(4)}</span>
          </div>
        `;
      }).join("");
    }

    map.on("click", async function (e) {
      hasSearchedPlaces = false;
      clearPlaceMarkers();
      clearRouteLayers();
      document.getElementById("status").innerText = "";

      const res = await fetch("/api/points", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ lat: e.latlng.lat, lon: e.latlng.lng })
      });
      const data = await res.json();
      renderPoints(data);
    });

    async function searchInBbox(fitBounds = true) {
      const pad = getPad();
      const categories = getSelectedCategories();
      document.getElementById("status").innerText = "Ищем места в прямоугольнике...";
      clearRouteLayers();

      const res = await fetch("/api/search-places", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ pad: pad, categories: categories })
      });
      const data = await res.json();

      if (!res.ok) {
        document.getElementById("status").innerText = data.error || "Ошибка";
        return;
      }

      hasSearchedPlaces = true;
      const srcNote = data.source === "local_saratov_geojson" ? " [saratov.geojson]" : "";
      document.getElementById("status").innerText = `Найдено мест: ${data.count}${srcNote}`;
      drawRectangle(data.bbox, fitBounds);
      renderPlaces(data.places);
    }

    async function buildInterestingRoute() {
      const pad = getPad();
      const maxDetourKm = parseFloat(document.getElementById("detourSlider").value);
      const maxStops = parseInt(document.getElementById("stopsSlider").value, 10);
      const categories = getSelectedCategories();

      document.getElementById("status").innerText = "Подбираем остановки и строим маршрут...";

      const res = await fetch("/api/build-route", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          pad: pad,
          max_detour_km: maxDetourKm,
          max_stops: maxStops,
          categories: categories,
          priority_categories: categories
        })
      });
      const data = await res.json();

      if (!res.ok) {
        document.getElementById("status").innerText = data.error || "Ошибка построения маршрута";
        return;
      }

      document.getElementById("status").innerText =
        `Остановок в маршруте: ${(data.stops || []).length} (лимит крюка: ${maxDetourKm} км)`;
      renderRoute(data);
    }

    fetch("/api/points")
      .then(r => r.json())
      .then(data => {
        renderPoints(data);
        if (data.bbox) drawRectangle(data.bbox, false);
        if (Array.isArray(data.places) && data.places.length > 0) {
          hasSearchedPlaces = true;
          renderPlaces(data.places);
        }
        if (data.route_result) renderRoute(data.route_result);
      });
  </script>
</body>
</html>
